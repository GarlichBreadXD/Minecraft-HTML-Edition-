<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>Minecraft HTML Edition</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      touch-action: none;
      font-family: sans-serif;
    }

    #info,
    #account {
      position: absolute;
      top: 10px;
      z-index: 5;
      padding: 8px;
      border-radius: 6px;
      color: white;
      background: rgba(0,0,0,.45);
      font-size: 12px;
      pointer-events: none;
    }

    #info { left: 10px; }
    #account { right: 10px; text-align: right; }

    #crosshair {
      position: fixed;
      left: 50%;
      top: 50%;
      z-index: 10;
      transform: translate(-50%, -50%);
      color: white;
      font: bold 28px/1 Arial, sans-serif;
      text-shadow: 1px 1px 2px #000;
      pointer-events: none;
      user-select: none;
    }

    #hotbar {
      position: absolute;
      left: 50%;
      bottom: 20px;
      z-index: 5;
      display: flex;
      gap: 6px;
      transform: translateX(-50%);
    }

    .slot {
      width: 50px;
      height: 50px;
      border: 2px solid #444;
      border-radius: 6px;
      background: rgba(0,0,0,.65);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 10px;
      cursor: pointer;
      user-select: none;
    }

    .slot.selected {
      border-color: #fbbf24;
      box-shadow: 0 0 0 2px rgba(251,191,36,.6);
    }

    .slot-inner {
      width: 28px;
      height: 28px;
      margin-bottom: 2px;
      border-radius: 4px;
      background-size: cover;
      image-rendering: pixelated;
    }

    #settings-btn {
      position: absolute;
      right: 10px;
      top: 100px;
      z-index: 20;
      padding: 8px 10px;
      border: 1px solid #888;
      border-radius: 6px;
      color: white;
      background: rgba(0,0,0,.7);
      cursor: pointer;
      font-size: 13px;
    }

    #settings-menu[hidden] {
      display: none;
    }

    #settings-menu {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.7);
    }

    #settings-panel {
      width: min(330px, calc(100vw - 32px));
      padding: 20px;
      border: 2px solid #777;
      border-radius: 10px;
      color: white;
      background: #252525;
      box-shadow: 0 8px 30px #0008;
    }

    #settings-panel h2 {
      margin: 0 0 18px;
    }

    #settings-panel label {
      display: block;
      margin: 14px 0 6px;
    }

    #settings-panel input[type="range"] {
      width: 100%;
    }

    #settings-panel output {
      float: right;
      color: #fbbf24;
    }

    .checkbox-row {
      display: flex !important;
      align-items: center;
      gap: 8px;
    }

    #settings-panel button {
      width: 100%;
      margin-top: 16px;
      padding: 9px;
      border: 0;
      border-radius: 6px;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    #reset-world-btn { background: #b83232; }
    #close-settings-btn { background: #555; }

    #main-menu[hidden] {
      display: none;
    }

    #main-menu {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(rgba(0, 0, 0, .35), rgba(0, 0, 0, .7)),
        #3b7d3b;
    }

    #main-menu-panel {
      width: min(360px, calc(100vw - 32px));
      padding: 28px;
      border: 3px solid #222;
      border-radius: 10px;
      color: white;
      background: rgba(35, 35, 35, .95);
      box-shadow: 0 10px 35px #0009;
      text-align: center;
    }

    #main-menu-title {
      margin: 0 0 8px;
      font-size: 30px;
      text-shadow: 3px 3px #000;
    }

    #main-menu-subtitle {
      margin: 0 0 24px;
      color: #ddd;
      font-size: 13px;
    }

    #main-menu button {
      width: 100%;
      margin-top: 10px;
      padding: 12px;
      border: 2px solid #222;
      border-radius: 6px;
      color: white;
      background: #4caf50;
      cursor: pointer;
      font-size: 16px;
    }

    #main-menu button:hover {
      background: #65c965;
    }

    #main-menu-settings-btn {
      background: #555 !important;
    }

    #main-menu-reset-btn {
      background: #a83232 !important;
    }

    #mobile-ui {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
    }

    #look-area {
      position: absolute;
      right: 0;
      top: 0;
      bottom: 0;
      width: 50%;
      z-index: 1;
      pointer-events: auto;
      touch-action: none;
    }

    #joystick,
    #jump-btn,
    #cam-btn {
      z-index: 3;
    }

    #joystick {
      position: absolute;
      left: 40px;
      bottom: 60px;
      width: 80px;
      height: 80px;
      border: 2px solid #666;
      border-radius: 50%;
      background: rgba(0,0,0,.4);
      pointer-events: auto;
      touch-action: none;
    }

    #joystick-knob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,.4);
      transform: translate(-50%,-50%);
    }

    #jump-btn,
    #cam-btn {
      position: absolute;
      right: 40px;
      border: 2px solid #666;
      border-radius: 6px;
      color: white;
      background: rgba(0,0,0,.4);
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
      touch-action: none;
      user-select: none;
    }

    #jump-btn {
      bottom: 80px;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 12px;
    }

    #cam-btn {
      bottom: 160px;
      width: 60px;
      height: 30px;
      font-size: 10px;
    }
  </style>
</head>

<body>
  <div id="crosshair">+</div>

  <div id="info">
    Minecraft HTML Edition<br>
    Desktop: WASD · Space · Mouse look · F5 camera<br>
    Mobile: Joystick · Jump · Swipe look · Tap/hold place/break
  </div>

  <div id="account"></div>

  <button id="settings-btn" type="button">⚙ Settings</button>

  <div id="settings-menu" hidden>
    <div id="settings-panel">
      <h2>Settings</h2>

      <label for="fov-slider">
        FOV:
        <output id="fov-value">75</output>
      </label>
      <input id="fov-slider" type="range" min="50" max="110" value="75">

      <label for="sensitivity-slider">
        Sensitivity:
        <output id="sensitivity-value">0.0020</output>
      </label>
      <input
        id="sensitivity-slider"
        type="range"
        min="0.0005"
        max="0.006"
        step="0.0001"
        value="0.002"
      >

      <label class="checkbox-row">
        <input id="invert-look-checkbox" type="checkbox">
        Invert vertical look
      </label>

      <button id="reset-world-btn" type="button">
        Reset World
      </button>

      <button id="close-settings-btn" type="button">
        Close
      </button>
    </div>
  </div>

  <div id="main-menu">
    <div id="main-menu-panel">
      <h1 id="main-menu-title">Minecraft HTML Edition</h1>
      <p id="main-menu-subtitle">
        Welcome, <span id="main-menu-username"></span>
      </p>

      <button id="play-btn" type="button">Play</button>
      <button id="main-menu-settings-btn" type="button">
        Settings
      </button>
      <button id="main-menu-reset-btn" type="button">
        Reset World
      </button>
    </div>
  </div>

  <div id="hotbar"></div>

  <div id="mobile-ui" style="display:none">
    <div id="joystick">
      <div id="joystick-knob"></div>
    </div>
    <div id="jump-btn">JUMP</div>
    <div id="cam-btn">CAM</div>
    <div id="look-area"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>

  <script>
    "use strict";

    const WORLD_SIZE = 20;
    const HEIGHT_LIMIT = 20;

    const GROUND_Y = 0.5;
    const PLAYER_RADIUS = 0.35;
    const PLAYER_HEIGHT = 2.0;

    const MOVE_SPEED = 3.5;
    const GRAVITY = 20;
    const JUMP_SPEED = 8.5;

    let mouseSensitivity = 0.0008;
    let touchSensitivity = 0.002;
    const JOYSTICK_STRENGTH = 0.7;

    let invertLook = false;
    let selectedBlock = "grass";
    let gameStarted = false;
    let resettingWorld = false;

    // ------------------------------------------------------------
    // Account
    // ------------------------------------------------------------

    let username = localStorage.getItem("mc_html_username");

    if (!username) {
      username = prompt("Enter your username (local only):") || "Player";
      localStorage.setItem("mc_html_username", username);
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;"
      }[character]));
    }

    document.getElementById("account").innerHTML =
      `Logged in as <b>${escapeHtml(username)}</b><br>` +
      `Local account only · Worlds stored on this device<br>` +
      `You cannot log in from other devices.`;

    const mainMenu = document.getElementById("main-menu");
    const mainMenuUsername = document.getElementById("main-menu-username");
    const playButton = document.getElementById("play-btn");
    const mainMenuSettingsButton =
      document.getElementById("main-menu-settings-btn");
    const mainMenuResetButton =
      document.getElementById("main-menu-reset-btn");

    mainMenuUsername.textContent = username;

    playButton.addEventListener("click", () => {
      gameStarted = true;
      mainMenu.hidden = true;
    });

    mainMenuSettingsButton.addEventListener("click", () => {
      settingsMenu.hidden = false;
    });

    mainMenuResetButton.addEventListener("click", resetWorld);

    // ------------------------------------------------------------
    // Settings
    // ------------------------------------------------------------

    const settingsButton = document.getElementById("settings-btn");
    const settingsMenu = document.getElementById("settings-menu");
    const closeSettingsButton =
      document.getElementById("close-settings-btn");

    const fovSlider = document.getElementById("fov-slider");
    const fovValue = document.getElementById("fov-value");

    const sensitivitySlider =
      document.getElementById("sensitivity-slider");

    const sensitivityValue =
      document.getElementById("sensitivity-value");

    const invertLookCheckbox =
      document.getElementById("invert-look-checkbox");

    const resetWorldButton =
      document.getElementById("reset-world-btn");

    settingsButton.addEventListener("click", event => {
      event.stopPropagation();
      settingsMenu.hidden = false;
    });

    closeSettingsButton.addEventListener("click", () => {
      settingsMenu.hidden = true;
      if (!gameStarted) {
        mainMenu.hidden = false;
      }
    });

    settingsMenu.addEventListener("click", event => {
      if (event.target === settingsMenu) {
        settingsMenu.hidden = true;
        if (!gameStarted) {
          mainMenu.hidden = false;
        }
      }
    });

    fovSlider.addEventListener("input", () => {
      camera.fov = Number(fovSlider.value);
      camera.updateProjectionMatrix();
      fovValue.value = fovSlider.value;
      localStorage.setItem("mc_fov", fovSlider.value);
    });

    sensitivitySlider.addEventListener("input", () => {
      const value = Number(sensitivitySlider.value);

      touchSensitivity = value;
      mouseSensitivity = value * 0.4;

      sensitivityValue.value = value.toFixed(4);
      localStorage.setItem("mc_sensitivity", value);
    });

    invertLookCheckbox.addEventListener("change", () => {
      invertLook = invertLookCheckbox.checked;
      localStorage.setItem("mc_invert_look", String(invertLook));
    });

    function resetWorld() {
      if (!confirm("Reset your world? This deletes placed blocks.")) {
        return;
      }

      resettingWorld = true;
      localStorage.removeItem("mc_world_" + username);

      if (worldSaveInterval) {
        clearInterval(worldSaveInterval);
      }

      location.reload();
    }

    resetWorldButton.addEventListener("click", resetWorld);

    function loadSettings() {
      const savedFov = Number(localStorage.getItem("mc_fov"));
      const savedSensitivity = Number(localStorage.getItem("mc_sensitivity"));

      if (Number.isFinite(savedFov)) {
        fovSlider.value = String(
          THREE.MathUtils.clamp(savedFov, 50, 110)
        );
      }

      if (Number.isFinite(savedSensitivity)) {
        sensitivitySlider.value = String(
          THREE.MathUtils.clamp(savedSensitivity, 0.0005, 0.006)
        );
      }

      invertLook = false;
      localStorage.setItem("mc_invert_look", "false");
      invertLookCheckbox.checked = false;

      camera.fov = Number(fovSlider.value);
      camera.updateProjectionMatrix();

      touchSensitivity = Number(sensitivitySlider.value);
      mouseSensitivity = touchSensitivity * 0.4;

      fovValue.value = fovSlider.value;
      sensitivityValue.value = touchSensitivity.toFixed(4);
    }

    // ------------------------------------------------------------
    // Textures and Three.js
    // ------------------------------------------------------------

    function makePixelTexture(colors) {
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = 16;

      const context = canvas.getContext("2d");

      for (let y = 0; y < 16; y++) {
        for (let x = 0; x < 16; x++) {
          context.fillStyle = colors[(x + y) % colors.length];
          context.fillRect(x, y, 1, 1);
        }
      }

      const texture = new THREE.CanvasTexture(canvas);
      texture.magFilter = THREE.NearestFilter;
      texture.minFilter = THREE.NearestFilter;
      return texture;
    }

    const grassTex = makePixelTexture([
      "#3ba635", "#2f8f2f", "#4acb3f"
    ]);

    const stoneTex = makePixelTexture([
      "#7d7d7d", "#6b6b6b", "#8f8f8f"
    ]);

    const woodTex = makePixelTexture([
      "#a56b3f", "#8b5a2b", "#b87333"
    ]);

    const mats = {
      grass: new THREE.MeshLambertMaterial({ map: grassTex }),
      stone: new THREE.MeshLambertMaterial({ map: stoneTex }),
      wood: new THREE.MeshLambertMaterial({ map: woodTex })
    };

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(
      75,
      innerWidth / innerHeight,
      0.1,
      1000
    );

    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    const sun = new THREE.DirectionalLight(0xffffff, 1);
    sun.position.set(10, 20, 10);
    scene.add(sun);
    scene.add(new THREE.AmbientLight(0xffffff, 0.4));

    // ------------------------------------------------------------
    // World
    // ------------------------------------------------------------

    const world = [];
    const blockMeshes = new Set();
    const blockGeometry = new THREE.BoxGeometry(1, 1, 1);

    for (let x = 0; x < WORLD_SIZE; x++) {
      world[x] = [];

      for (let z = 0; z < WORLD_SIZE; z++) {
        world[x][z] = [];
      }
    }

    function insideWorld(x, y, z) {
      return (
        x >= 0 &&
        x < WORLD_SIZE &&
        y >= 0 &&
        y < HEIGHT_LIMIT &&
        z >= 0 &&
        z < WORLD_SIZE
      );
    }

    function createBlock(x, y, z, type) {
      if (!insideWorld(x, y, z)) return null;
      if (world[x][z][y]) return world[x][z][y].mesh;

      const actualType = mats[type] ? type : "stone";

      const mesh = new THREE.Mesh(
        blockGeometry,
        mats[actualType]
      );

      mesh.position.set(x, y, z);
      mesh.userData.isBlock = true;

      scene.add(mesh);
      blockMeshes.add(mesh);

      world[x][z][y] = {
        mesh,
        type: actualType
      };

      return mesh;
    }

    function removeBlock(x, y, z) {
      if (!insideWorld(x, y, z)) return;

      const cell = world[x][z][y];
      if (!cell) return;

      scene.remove(cell.mesh);
      blockMeshes.delete(cell.mesh);
      world[x][z][y] = null;
    }

    for (let x = 0; x < WORLD_SIZE; x++) {
      for (let z = 0; z < WORLD_SIZE; z++) {
        createBlock(x, 0, z, "grass");
      }
    }

    // ------------------------------------------------------------
    // Clouds
    // ------------------------------------------------------------

    const clouds = [];

    function addCloud(x, y, z) {
      const group = new THREE.Group();
      const material = new THREE.MeshLambertMaterial({ color: 0xffffff });

      for (let i = 0; i < 5; i++) {
        const cube = new THREE.Mesh(
          new THREE.BoxGeometry(2, 1, 2),
          material
        );

        cube.position.set(
          (Math.random() - 0.5) * 4,
          (Math.random() - 0.5),
          (Math.random() - 0.5) * 4
        );

        group.add(cube);
      }

      group.position.set(x, y, z);
      scene.add(group);
      clouds.push(group);
    }

    for (let i = 0; i < 6; i++) {
      addCloud(
        Math.random() * WORLD_SIZE,
        15 + Math.random() * 3,
        Math.random() * WORLD_SIZE
      );
    }

    // ------------------------------------------------------------
    // Player
    // ------------------------------------------------------------

    const playerPos = new THREE.Vector3(
      WORLD_SIZE / 2,
      GROUND_Y,
      Math.min(WORLD_SIZE - 1, WORLD_SIZE / 2 + 5)
    );

    let yaw = 0;
    let pitch = 0;
    let velocityY = 0;
    let onGround = true;
    let camMode = 0;

    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    const bobSkin = new THREE.MeshLambertMaterial({ color: 0xffd0a5 });
    const bobHair = new THREE.MeshLambertMaterial({ color: 0x171717 });
    const bobShirt = new THREE.MeshLambertMaterial({ color: 0xf2f2f2 });
    const bobApron = new THREE.MeshLambertMaterial({ color: 0x4d6f91 });
    const bobPants = new THREE.MeshLambertMaterial({ color: 0x252525 });
    const bobShoes = new THREE.MeshLambertMaterial({ color: 0x111111 });

    function addPlayerPart(geometry, material, x, y, z) {
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(x, y, z);
      playerGroup.add(mesh);
      return mesh;
    }

    addPlayerPart(new THREE.BoxGeometry(.8,.8,.8), bobSkin, 0, 1.6, 0);
    addPlayerPart(new THREE.BoxGeometry(.86,.25,.84), bobHair, 0, 2.02, 0);
    addPlayerPart(new THREE.BoxGeometry(.12,.42,.7), bobHair, -.43, 1.78, 0);
    addPlayerPart(new THREE.BoxGeometry(.12,.42,.7), bobHair, .43, 1.78, 0);
    addPlayerPart(new THREE.BoxGeometry(.16,.16,.18), bobSkin, 0, 1.55, .43);

    const mustacheLeft = addPlayerPart(
      new THREE.BoxGeometry(.24,.1,.12),
      bobHair, -.12, 1.43, .43
    );
    mustacheLeft.rotation.z = -.15;

    const mustacheRight = addPlayerPart(
      new THREE.BoxGeometry(.24,.1,.12),
      bobHair, .12, 1.43, .43
    );
    mustacheRight.rotation.z = .15;

    addPlayerPart(new THREE.BoxGeometry(1,1.2,.6), bobShirt, 0, .7, 0);
    addPlayerPart(new THREE.BoxGeometry(.72,.9,.08), bobApron, 0, .75, .34);
    addPlayerPart(new THREE.BoxGeometry(.28,1.05,.32), bobShirt, -.64, .75, 0);
    addPlayerPart(new THREE.BoxGeometry(.28,1.05,.32), bobShirt, .64, .75, 0);
    addPlayerPart(new THREE.BoxGeometry(.4,.9,.4), bobPants, -.2, 0, 0);
    addPlayerPart(new THREE.BoxGeometry(.4,.9,.4), bobPants, .2, 0, 0);
    addPlayerPart(new THREE.BoxGeometry(.44,.18,.55), bobShoes, -.2, -.42, .08);
    addPlayerPart(new THREE.BoxGeometry(.44,.18,.55), bobShoes, .2, -.42, .08);

    // ------------------------------------------------------------
    // Input
    // ------------------------------------------------------------

    const isTouch =
      "ontouchstart" in window ||
      navigator.maxTouchPoints > 0;

    const keys = {};
    const mobileUI = document.getElementById("mobile-ui");

    if (isTouch) {
      mobileUI.style.display = "block";
    }

    if (!isTouch) {
      document.addEventListener("keydown", event => {
        keys[event.code] = true;

        if (event.code === "Space" || event.code === "F5") {
          event.preventDefault();
        }

        if (event.code === "F5") {
          camMode = (camMode + 1) % 3;
        }

        if (event.code.startsWith("Digit")) {
          const index = Number(event.code.slice(5)) - 1;

          if (BLOCK_TYPES[index]) {
            selectedBlock = BLOCK_TYPES[index].id;
            renderHotbar();
          }
        }
      });

      document.addEventListener("keyup", event => {
        keys[event.code] = false;
      });

      document.body.addEventListener("click", event => {
        if (
          event.target.closest("#hotbar") ||
          event.target.closest("#settings-btn")
        ) {
          return;
        }

        if (document.pointerLockElement !== document.body) {
          document.body.requestPointerLock();
        }
      });

      document.addEventListener("mousemove", event => {
        if (document.pointerLockElement !== document.body) return;

        const verticalDirection = invertLook ? -1 : 1;

        yaw += event.movementX * mouseSensitivity;
        pitch += event.movementY * mouseSensitivity * verticalDirection;

        pitch = THREE.MathUtils.clamp(
          pitch,
          -Math.PI / 2 + .1,
          Math.PI / 2 - .1
        );
      });

      document.addEventListener("mousedown", event => {
        if (event.target.closest("#hotbar")) return;

        if (event.button === 0) placeBlockFromRay();
        if (event.button === 2) breakBlockFromRay();
      });

      document.addEventListener("contextmenu", event => {
        event.preventDefault();
      });
    }

    // ------------------------------------------------------------
    // Mobile camera
    // ------------------------------------------------------------

    const lookArea = document.getElementById("look-area");

    if (isTouch) {
      let lastLookTouch = null;

      lookArea.addEventListener("touchstart", event => {
        if (!event.touches.length) return;

        const touch = event.touches[0];

        lastLookTouch = {
          x: touch.clientX,
          y: touch.clientY
        };
      }, { passive: true });

      lookArea.addEventListener("touchmove", event => {
        if (!lastLookTouch || !event.touches.length) return;

        const touch = event.touches[0];
        const dx = touch.clientX - lastLookTouch.x;
        const dy = touch.clientY - lastLookTouch.y;
        const verticalDirection = invertLook ? -1 : 1;

        yaw += dx * touchSensitivity;
        pitch += dy * touchSensitivity * verticalDirection;

        lastLookTouch = {
          x: touch.clientX,
          y: touch.clientY
        };

        pitch = THREE.MathUtils.clamp(
          pitch,
          -Math.PI / 2 + .1,
          Math.PI / 2 - .1
        );
      }, { passive: true });

      lookArea.addEventListener("touchend", () => {
        lastLookTouch = null;
      }, { passive: true });

      lookArea.addEventListener("touchcancel", () => {
        lastLookTouch = null;
      }, { passive: true });
    }

    // ------------------------------------------------------------
    // Mobile joystick
    // ------------------------------------------------------------

    const joyVec = { x: 0, y: 0 };

    if (isTouch) {
      const joystick = document.getElementById("joystick");
      const knob = document.getElementById("joystick-knob");

      let joystickActive = false;
      let centerX = 0;
      let centerY = 0;

      function resetJoystick() {
        joystickActive = false;
        joyVec.x = 0;
        joyVec.y = 0;
        knob.style.transform = "translate(-50%,-50%)";
      }

      joystick.addEventListener("touchstart", event => {
        event.preventDefault();

        joystickActive = true;

        const rect = joystick.getBoundingClientRect();
        centerX = rect.left + rect.width / 2;
        centerY = rect.top + rect.height / 2;
      }, { passive: false });

      joystick.addEventListener("touchmove", event => {
        if (!joystickActive || !event.touches.length) return;

        event.preventDefault();

        const touch = event.touches[0];
        const dx = touch.clientX - centerX;
        const dy = touch.clientY - centerY;

        const maxDistance = 30;
        const distance = Math.hypot(dx, dy);
        const scale = distance > maxDistance ? maxDistance / distance : 1;

        const limitedX = dx * scale;
        const limitedY = dy * scale;

        knob.style.transform = `translate(${limitedX - 20}px,${limitedY - 20}px)`;

        joyVec.x = (limitedX / maxDistance) * JOYSTICK_STRENGTH;
        joyVec.y = (-limitedY / maxDistance) * JOYSTICK_STRENGTH;
      }, { passive: false });

      joystick.addEventListener("touchend", resetJoystick);
      joystick.addEventListener("touchcancel", resetJoystick);

      const jumpButton = document.getElementById("jump-btn");
      const cameraButton = document.getElementById("cam-btn");

      jumpButton.addEventListener("touchstart", event => {
        event.preventDefault();

        if (onGround) {
          velocityY = JUMP_SPEED;
          onGround = false;
        }
      }, { passive: false });

      cameraButton.addEventListener("touchstart", event => {
        event.preventDefault();
        camMode = (camMode + 1) % 3;
      }, { passive: false });
    }

    // ------------------------------------------------------------
    // Collision
    // ------------------------------------------------------------

    function blockOverlapsPlayer(x, y, z, position) {
      return (
        position.x - PLAYER_RADIUS < x + .5 &&
        position.x + PLAYER_RADIUS > x - .5 &&
        position.y < y + .5 &&
        position.y + PLAYER_HEIGHT > y - .5 &&
        position.z - PLAYER_RADIUS < z + .5 &&
        position.z + PLAYER_RADIUS > z - .5
      );
    }

    function collidesWithBlock(position) {
      const minX = Math.max(0, Math.floor(position.x - PLAYER_RADIUS - 1));
      const maxX = Math.min(WORLD_SIZE - 1, Math.ceil(position.x + PLAYER_RADIUS + 1));
      const minZ = Math.max(0, Math.floor(position.z - PLAYER_RADIUS - 1));
      const maxZ = Math.min(WORLD_SIZE - 1, Math.ceil(position.z + PLAYER_RADIUS + 1));
      const minY = Math.max(0, Math.floor(position.y - 1));
      const maxY = Math.min(HEIGHT_LIMIT - 1, Math.ceil(position.y + PLAYER_HEIGHT + 1));

      for (let x = minX; x <= maxX; x++) {
        for (let z = minZ; z <= maxZ; z++) {
          for (let y = minY; y <= maxY; y++) {
            if (world[x][z][y] && blockOverlapsPlayer(x, y, z, position)) {
              return true;
            }
          }
        }
      }

      return false;
    }

    function getStandingHeight(position, maximumY) {
      let floorY = GROUND_Y;

      const minX = Math.max(0, Math.floor(position.x - PLAYER_RADIUS - 1));
      const maxX = Math.min(WORLD_SIZE - 1, Math.ceil(position.x + PLAYER_RADIUS + 1));
      const minZ = Math.max(0, Math.floor(position.z - PLAYER_RADIUS - 1));
      const maxZ = Math.min(WORLD_SIZE - 1, Math.ceil(position.z + PLAYER_RADIUS + 1));

      for (let x = minX; x <= maxX; x++) {
        for (let z = minZ; z <= maxZ; z++) {
          for (let y = 0; y < HEIGHT_LIMIT; y++) {
            if (!world[x][z][y]) continue;

            const overlapsHorizontally =
              Math.abs(position.x - x) < PLAYER_RADIUS + .5 &&
              Math.abs(position.z - z) < PLAYER_RADIUS + .5;

            const blockTop = y + .5;

            if (
              overlapsHorizontally &&
              blockTop <= maximumY + .05 &&
              blockTop > floorY
            ) {
              floorY = blockTop;
            }
          }
        }
      }

      return floorY;
    }

    // ------------------------------------------------------------
    // Movement and camera
    // ------------------------------------------------------------

    function updatePlayer(deltaTime) {
      const dt = Math.min(deltaTime, .05);

      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
      const right = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
      const move = new THREE.Vector3();

      if (!isTouch) {
        if (keys.KeyW) move.add(forward);
        if (keys.KeyS) move.sub(forward);
        if (keys.KeyA) move.sub(right);
        if (keys.KeyD) move.add(right);

        if (keys.Space && onGround) {
          velocityY = JUMP_SPEED;
          onGround = false;
        }
      } else {
        move.add(forward.clone().multiplyScalar(joyVec.y));
        move.add(right.clone().multiplyScalar(joyVec.x));
      }

      if (move.lengthSq() > 0) {
        move.normalize().multiplyScalar(MOVE_SPEED * dt);

        const nextX = playerPos.clone();
        nextX.x += move.x;

        if (!collidesWithBlock(nextX)) {
          playerPos.x = nextX.x;
        }

        const nextZ = playerPos.clone();
        nextZ.z += move.z;

        if (!collidesWithBlock(nextZ)) {
          playerPos.z = nextZ.z;
        }
      }

      playerPos.x = THREE.MathUtils.clamp(playerPos.x, PLAYER_RADIUS, WORLD_SIZE - 1 - PLAYER_RADIUS);
      playerPos.z = THREE.MathUtils.clamp(playerPos.z, PLAYER_RADIUS, WORLD_SIZE - 1 - PLAYER_RADIUS);

      const previousY = playerPos.y;
      velocityY -= GRAVITY * dt;

      const nextY = playerPos.clone();
      nextY.y += velocityY * dt;

      if (velocityY <= 0) {
        const floorY = getStandingHeight(playerPos, previousY);

        if (nextY.y <= floorY) {
          playerPos.y = floorY;
          velocityY = 0;
          onGround = true;
        } else {
          playerPos.y = nextY.y;
          onGround = false;
        }
      } else {
        if (collidesWithBlock(nextY)) {
          velocityY = 0;
        } else {
          playerPos.y = nextY.y;
        }

        onGround = false;
      }

      playerGroup.position.copy(playerPos);
      playerGroup.visible = camMode !== 0;

      const headPosition = playerPos.clone().add(new THREE.Vector3(0, 1.6, 0));
      const lookDirection = new THREE.Vector3(
        Math.sin(yaw) * Math.cos(pitch),
        Math.sin(pitch),
        Math.cos(yaw) * Math.cos(pitch)
      );

      if (camMode === 0) {
        camera.position.copy(headPosition);
        camera.lookAt(headPosition.clone().add(lookDirection));
      } else if (camMode === 1) {
        const cameraPosition = headPosition.clone().sub(lookDirection.clone().multiplyScalar(4));
        cameraPosition.y += 1;
        camera.position.copy(cameraPosition);
        camera.lookAt(headPosition);
      } else {
        const cameraPosition = headPosition.clone().add(lookDirection.clone().multiplyScalar(4));
        cameraPosition.y += 1;
        camera.position.copy(cameraPosition);
        camera.lookAt(headPosition);
      }
    }

    // ------------------------------------------------------------
    // Hotbar
    // ------------------------------------------------------------

    const BLOCK_TYPES = [
      { id: "grass", name: "Grass" },
      { id: "stone", name: "Stone" },
      { id: "wood", name: "Wood" }
    ];

    const hotbar = document.getElementById("hotbar");

    function renderHotbar() {
      hotbar.innerHTML = "";

      BLOCK_TYPES.forEach(blockType => {
        const slot = document.createElement("div");

        slot.className = "slot" + (blockType.id === selectedBlock ? " selected" : "");

        const inner = document.createElement("div");
        inner.className = "slot-inner";

        const texture =
          blockType.id === "grass"
            ? grassTex
            : blockType.id === "stone"
              ? stoneTex
              : woodTex;

        inner.style.backgroundImage = `url(${texture.image.toDataURL()})`;

        const label = document.createElement("div");
        label.textContent = blockType.name;

        slot.appendChild(inner);
        slot.appendChild(label);

        slot.addEventListener("click", event => {
          event.stopPropagation();
          selectedBlock = blockType.id;
          renderHotbar();
        });

        hotbar.appendChild(slot);
      });
    }

    renderHotbar();

    // ------------------------------------------------------------
    // Block actions
    // ------------------------------------------------------------

    const raycaster = new THREE.Raycaster();

    function getLookDirection() {
      const direction = new THREE.Vector3();
      camera.getWorldDirection(direction);
      return direction.normalize();
    }

    function getBlockHits() {
      raycaster.set(camera.position, getLookDirection());
      raycaster.near = 0;
      raycaster.far = 5;

      return raycaster.intersectObjects(Array.from(blockMeshes), false);
    }

    function isInsidePlayer(x, y, z) {
      return (
        Math.abs(x - playerPos.x) < 1 &&
        Math.abs(y - (playerPos.y + 1)) < 2 &&
        Math.abs(z - playerPos.z) < 1
      );
    }

    function placeBlockFromRay() {
      const hits = getBlockHits();
      if (!hits.length) return;

      const hit = hits[0];
      if (!hit.face || !hit.object) return;

      const normal = hit.face.normal;

      const x = Math.round(hit.object.position.x + normal.x);
      const y = Math.round(hit.object.position.y + normal.y);
      const z = Math.round(hit.object.position.z + normal.z);

      if (!insideWorld(x, y, z)) return;
      if (world[x][z][y]) return;
      if (isInsidePlayer(x, y, z)) return;

      createBlock(x, y, z, selectedBlock);
    }

    function breakBlockFromRay() {
      const hits = getBlockHits();
      if (!hits.length) return;

      const block = hits[0].object;

      const x = Math.round(block.position.x);
      const y = Math.round(block.position.y);
      const z = Math.round(block.position.z);

      if (y === 0) return;

      removeBlock(x, y, z);
    }

    // ------------------------------------------------------------
    // Mobile place and break
    // ------------------------------------------------------------

    if (isTouch) {
      let touchStart = null;
      let touchTimer = null;
      let touchMoved = false;

      lookArea.addEventListener("touchstart", event => {
        if (!event.touches.length) return;

        event.preventDefault();

        const touch = event.touches[0];

        touchStart = {
          x: touch.clientX,
          y: touch.clientY,
          time: performance.now()
        };

        touchMoved = false;

        touchTimer = setTimeout(() => {
          if (!touchMoved) breakBlockFromRay();
          touchTimer = null;
        }, 350);
      }, { passive: false });

      lookArea.addEventListener("touchmove", event => {
        if (!touchStart || !event.touches.length) return;

        event.preventDefault();

        const touch = event.touches[0];

        if (Math.hypot(touch.clientX - touchStart.x, touch.clientY - touchStart.y) > 8) {
          touchMoved = true;

          if (touchTimer) {
            clearTimeout(touchTimer);
            touchTimer = null;
          }
        }
      }, { passive: false });

      lookArea.addEventListener("touchend", event => {
        if (!touchStart) return;

        event.preventDefault();

        if (touchTimer) {
          clearTimeout(touchTimer);
          touchTimer = null;
        }

        if (!touchMoved && performance.now() - touchStart.time < 350) {
          placeBlockFromRay();
        }

        touchStart = null;
        touchMoved = false;
      }, { passive: false });

      lookArea.addEventListener("touchcancel", () => {
        if (touchTimer) clearTimeout(touchTimer);

        touchTimer = null;
        touchStart = null;
        touchMoved = false;
      });
    }

    // ------------------------------------------------------------
    // Save and load
    // ------------------------------------------------------------

    function saveWorld() {
      if (resettingWorld) {
        return;
      }

      const data = [];

      for (let x = 0; x < WORLD_SIZE; x++) {
        for (let z = 0; z < WORLD_SIZE; z++) {
          for (let y = 0; y < HEIGHT_LIMIT; y++) {
            const cell = world[x][z][y];

            if (cell && !(y === 0 && cell.type === "grass")) {
              data.push({ x, y, z, type: cell.type });
            }
          }
        }
      }

      localStorage.setItem("mc_world_" + username, JSON.stringify(data));
    }

    function loadWorld() {
      const raw = localStorage.getItem("mc_world_" + username);

      if (!raw) return;

      try {
        const data = JSON.parse(raw);

        if (!Array.isArray(data)) return;

        data.forEach(block => {
          if (
            block &&
            Number.isInteger(block.x) &&
            Number.isInteger(block.y) &&
            Number.isInteger(block.z)
          ) {
            createBlock(block.x, block.y, block.z, block.type);
          }
        });
      } catch (error) {
        console.error("Failed to load world:", error);
      }
    }

    loadSettings();
    loadWorld();

    let worldSaveInterval = setInterval(saveWorld, 5000);
    window.addEventListener("beforeunload", saveWorld);

    // ------------------------------------------------------------
    // Resize and game loop
    // ------------------------------------------------------------

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    let lastTime = performance.now();

    function animate(now) {
      const dt = Math.min((now - lastTime) / 1000, 0.05);
      lastTime = now;

      updatePlayer(dt);

      clouds.forEach(cloud => {
        cloud.position.x += 0.2 * dt;

        if (cloud.position.x > WORLD_SIZE + 10) {
          cloud.position.x = -10;
        }
      });

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    requestAnimationFrame(animate);
  </script>
</body>
