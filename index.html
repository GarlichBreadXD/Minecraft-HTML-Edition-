<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Minecraft HTML Edition</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#000;touch-action:none;font-family:sans-serif}#info,#account{position:absolute;top:10px;z-index:5;padding:8px;border-radius:6px;color:#fff;background:#0007;font-size:12px;pointer-events:none}#info{left:10px}#account{right:10px;text-align:right}#crosshair{position:fixed;left:50%;top:50%;z-index:10;transform:translate(-50%,-50%);color:#fff;font:bold 28px/1 Arial;text-shadow:1px 1px 2px #000;pointer-events:none}#hotbar{position:absolute;left:50%;bottom:20px;z-index:5;display:flex;gap:6px;transform:translateX(-50%)}.slot{width:50px;height:50px;border:2px solid #444;border-radius:6px;background:#000a;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-size:10px;cursor:pointer;user-select:none}.slot.selected{border-color:#fbbf24;box-shadow:0 0 0 2px #fbbf2499}.slot-inner{width:28px;height:28px;margin-bottom:2px;border-radius:4px;background-size:cover;image-rendering:pixelated}#settings-btn{position:absolute;right:10px;top:100px;z-index:20;padding:8px 10px;border:1px solid #888;border-radius:6px;color:#fff;background:#000b;cursor:pointer}#settings-menu[hidden],#main-menu[hidden]{display:none}#settings-menu,#main-menu{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:#000b}#settings-panel,#main-menu-panel{width:min(360px,calc(100vw - 32px));padding:22px;border:2px solid #777;border-radius:10px;color:#fff;background:#252525;box-shadow:0 8px 30px #0008}#settings-panel h2{margin:0 0 18px}#settings-panel label{display:block;margin:14px 0 6px}#settings-panel input[type=range]{width:100%}#settings-panel output{float:right;color:#fbbf24}#settings-panel button,#main-menu button{width:100%;margin-top:12px;padding:10px;border:0;border-radius:6px;color:#fff;cursor:pointer;font-size:14px}#reset-world-btn,#main-menu-reset-btn{background:#a83232}#close-settings-btn,#main-menu-settings-btn{background:#555}#main-menu{z-index:40;background:linear-gradient(#0005,#000b),#3b7d3b}#main-menu-panel{text-align:center;border:3px solid #222;background:#232323f2}#main-menu-title{margin:0 0 8px;font-size:30px;text-shadow:3px 3px #000}#main-menu-subtitle{margin:0 0 20px;color:#ddd;font-size:13px}#play-btn{background:#4caf50!important;font-size:16px!important}.checkbox-row{display:flex!important;align-items:center;gap:8px}#mobile-ui{position:absolute;inset:0;z-index:2;pointer-events:none}#look-area{position:absolute;right:0;top:0;bottom:0;width:50%;z-index:1;pointer-events:auto;touch-action:none}#joystick,#jump-btn,#cam-btn{z-index:3}#joystick{position:absolute;left:40px;bottom:60px;width:80px;height:80px;border:2px solid #666;border-radius:50%;background:#0006;pointer-events:auto;touch-action:none}#joystick-knob{position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;background:#fff6;transform:translate(-50%,-50%)}#jump-btn,#cam-btn{position:absolute;right:40px;border:2px solid #666;border-radius:6px;color:#fff;background:#0006;display:flex;align-items:center;justify-content:center;pointer-events:auto;touch-action:none;user-select:none}#jump-btn{bottom:80px;width:60px;height:60px;border-radius:50%;font-size:12px}#cam-btn{bottom:160px;width:60px;height:30px;font-size:10px}
</style>
</head>
<body>
<div id="crosshair">+</div><div id="info">Minecraft HTML Edition<br>Desktop: WASD · Space · Mouse look · F5 camera<br>Mobile: Joystick · Jump · Swipe look · Tap/hold place/break</div><div id="account"></div><button id="settings-btn">⚙ Settings</button>
<div id="settings-menu" hidden><div id="settings-panel"><h2>Settings</h2><label>FOV: <output id="fov-value">75</output></label><input id="fov-slider" type="range" min="50" max="110" value="75"><label>Sensitivity: <output id="sensitivity-value">0.0020</output></label><input id="sensitivity-slider" type="range" min=".0005" max=".006" step=".0001" value=".002"><label class="checkbox-row"><input id="invert-look-checkbox" type="checkbox">Invert vertical look</label><button id="reset-world-btn">Reset World</button><button id="close-settings-btn">Close</button></div></div>
<div id="main-menu"><div id="main-menu-panel"><h1 id="main-menu-title">Minecraft HTML Edition</h1><p id="main-menu-subtitle">Welcome, <span id="main-menu-username"></span></p><button id="play-btn">Play</button><button id="main-menu-settings-btn">Settings</button><button id="main-menu-reset-btn">Reset World</button></div></div><div id="hotbar"></div>
<div id="mobile-ui" style="display:none"><div id="joystick"><div id="joystick-knob"></div></div><div id="jump-btn">JUMP</div><div id="cam-btn">CAM</div><div id="look-area"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.152.2/three.min.js"></script>
<script>
"use strict";
const WORLD_SIZE=20,HEIGHT_LIMIT=20,GROUND_Y=.5,PLAYER_RADIUS=.45,PLAYER_HEIGHT=2,MOVE_SPEED=3.5,GRAVITY=20;
// v = sqrt(2*g*h): this gives a jump of approximately one block.
const JUMP_SPEED=Math.sqrt(2*GRAVITY*1),JOYSTICK_STRENGTH=.7;
let mouseSensitivity=.0008,touchSensitivity=.002,invertLook=false,selectedBlock="grass",gameStarted=false,resettingWorld=false;
let username=localStorage.getItem("mc_html_username")||prompt("Enter your username (local only):")||"Player";localStorage.setItem("mc_html_username",username);
const $=id=>document.getElementById(id);$("account").innerHTML=`Logged in as <b>${String(username).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}</b><br>Local account only · Worlds stored on this device`;$('main-menu-username').textContent=username;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,1000);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);scene.add(new THREE.DirectionalLight(0xffffff,1).position.set(10,20,10));scene.add(new THREE.AmbientLight(0xffffff,.4));
function makeTexture(kind){const c=document.createElement('canvas'),s=32;c.width=c.height=s;const x=c.getContext('2d');let base=kind==='grass'?'#3d9b36':kind==='stone'?'#777':'#9a5b2f';x.fillStyle=base;x.fillRect(0,0,s,s);for(let y=0;y<s;y++)for(let z=0;z<s;z++){let color;if(kind==='wood'){const grain=Math.sin(z*.9)+Math.sin(z*2.4);color=grain>1?'#b9793e':grain<-.7?'#75401f':'#98572d';if(z%8===0)color='#663519'}else if(kind==='stone'){const n=(Math.sin(z*12.7+y*4.1)*43758.5)%1;color=n>.75?'#a0a0a0':n<-.65?'#555':'#777'}else{const n=(Math.sin(z*9+y*13)*43758.5)%1;color=n>.68?'#62ba43':n<-.72?'#287a2c':'#3d9b36'}x.fillStyle=color;x.fillRect(z,y,1,1)}if(kind==='wood'){x.strokeStyle='#452512';x.lineWidth=1;for(let r=3;r<30;r+=6){x.beginPath();x.moveTo(0,r);x.bezierCurveTo(8,r-2,20,r+2,32,r);x.stroke()}}if(kind==='stone'){x.strokeStyle='#5558';for(let i=0;i<18;i++){let a=Math.random()*s,b=Math.random()*s;x.strokeRect(a,b,2+Math.random()*4,2+Math.random()*3)}}if(kind==='grass'){x.fillStyle='#7bd34c';for(let i=0;i<35;i++){let a=Math.random()*s,b=Math.random()*s;x.fillRect(a,b,1,Math.random()*3+1)}}const t=new THREE.CanvasTexture(c);t.magFilter=t.minFilter=THREE.NearestFilter;return t}
const grassTex=makeTexture('grass'),stoneTex=makeTexture('stone'),woodTex=makeTexture('wood');const mats={grass:new THREE.MeshLambertMaterial({map:grassTex}),stone:new THREE.MeshLambertMaterial({map:stoneTex}),wood:new THREE.MeshLambertMaterial({map:woodTex})};
const world=[],blockMeshes=new Set(),blockGeometry=new THREE.BoxGeometry(1,1,1);for(let x=0;x<WORLD_SIZE;x++){world[x]=[];for(let z=0;z<WORLD_SIZE;z++)world[x][z]=[]}function insideWorld(x,y,z){return x>=0&&x<WORLD_SIZE&&y>=0&&y<HEIGHT_LIMIT&&z>=0&&z<WORLD_SIZE}function createBlock(x,y,z,type){if(!insideWorld(x,y,z)||world[x][z][y])return;const mesh=new THREE.Mesh(blockGeometry,mats[mats[type]?type:'stone']);mesh.position.set(x,y,z);mesh.userData.isBlock=true;scene.add(mesh);blockMeshes.add(mesh);world[x][z][y]={mesh,type:mats[type]?type:'stone'}}function removeBlock(x,y,z){if(!insideWorld(x,y,z)||!world[x][z][y])return;scene.remove(world[x][z][y].mesh);blockMeshes.delete(world[x][z][y].mesh);world[x][z][y]=null}for(let x=0;x<WORLD_SIZE;x++)for(let z=0;z<WORLD_SIZE;z++)createBlock(x,0,z,'grass');
const playerPos=new THREE.Vector3(10,.5,15),playerGroup=new THREE.Group();scene.add(playerGroup);let yaw=0,pitch=0,velocityY=0,onGround=true,camMode=0;
const skin=new THREE.MeshLambertMaterial({color:0xffd0a5}),hair=new THREE.MeshLambertMaterial({color:0x171717}),shirt=new THREE.MeshLambertMaterial({color:0xf2f2f2}),apron=new THREE.MeshLambertMaterial({color:0x4d6f91}),pants=new THREE.MeshLambertMaterial({color:0x252525}),shoes=new THREE.MeshLambertMaterial({color:0x111111});function part(g,m,x,y,z){const q=new THREE.Mesh(g,m);q.position.set(x,y,z);playerGroup.add(q)}
// The visible model is exactly two blocks tall and never wider than one block.
part(new THREE.BoxGeometry(.42,.9,.42),pants,-.22,.45,0);part(new THREE.BoxGeometry(.42,.9,.42),pants,.22,.45,0);part(new THREE.BoxGeometry(1,.62,.55),shirt,0,1.21,0);part(new THREE.BoxGeometry(.72,.08,.08),apron,0,1.2,.31);part(new THREE.BoxGeometry(.15,.58,.3),shirt,-.57,1.2,0);part(new THREE.BoxGeometry(.15,.58,.3),shirt,.57,1.2,0);part(new THREE.BoxGeometry(.72,.48,.72),skin,0,1.75,0);part(new THREE.BoxGeometry(.76,.12,.76),hair,0,1.99,0);part(new THREE.BoxGeometry(.18,.1,.12),hair,-.1,1.62,.38);part(new THREE.BoxGeometry(.18,.1,.12),hair,.1,1.62,.38);part(new THREE.BoxGeometry(.48,.12,.5),shoes,-.22,0,.08);part(new THREE.BoxGeometry(.48,.12,.5),shoes,.22,0,.08);
const isTouch='ontouchstart'in window||navigator.maxTouchPoints>0,keys={},joyVec={x:0,y:0};if(isTouch)$('mobile-ui').style.display='block';const BLOCK_TYPES=[{id:'grass',name:'Grass',tex:grassTex},{id:'stone',name:'Stone',tex:stoneTex},{id:'wood',name:'Wood',tex:woodTex}];
function renderHotbar(){$('hotbar').innerHTML='';BLOCK_TYPES.forEach(b=>{const slot=document.createElement('div');slot.className='slot'+(selectedBlock===b.id?' selected':'');const inner=document.createElement('div');inner.className='slot-inner';inner.style.backgroundImage=`url(${b.tex.image.toDataURL()})`;slot.append(inner,Object.assign(document.createElement('div'),{textContent:b.name}));slot.onclick=e=>{e.stopPropagation();selectedBlock=b.id;renderHotbar()};$('hotbar').append(slot)})}renderHotbar();
function blockOverlapsPlayer(x,y,z,p){return p.x-PLAYER_RADIUS<x+.5&&p.x+PLAYER_RADIUS>x-.5&&p.y<y+.5&&p.y+PLAYER_HEIGHT>y-.5&&p.z-PLAYER_RADIUS<z+.5&&p.z+PLAYER_RADIUS>z-.5}function collides(p){for(let x=Math.max(0,Math.floor(p.x-1));x<Math.min(WORLD_SIZE,Math.ceil(p.x+1));x++)for(let z=Math.max(0,Math.floor(p.z-1));z<Math.min(WORLD_SIZE,Math.ceil(p.z+1));z++)for(let y=Math.max(0,Math.floor(p.y-1));y<Math.min(HEIGHT_LIMIT,Math.ceil(p.y+PLAYER_HEIGHT+1));y++)if(world[x][z][y]&&blockOverlapsPlayer(x,y,z,p))return true;return false}function standing(p,max){let floor=GROUND_Y;for(let x=0;x<WORLD_SIZE;x++)for(let z=0;z<WORLD_SIZE;z++)for(let y=0;y<HEIGHT_LIMIT;y++)if(world[x][z][y]&&Math.abs(p.x-x)<PLAYER_RADIUS+.5&&Math.abs(p.z-z)<PLAYER_RADIUS+.5&&y+.5<=max+.05&&y+.5>floor)floor=y+.5;return floor}
function updatePlayer(dt){dt=Math.min(dt,.05);const f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw)),m=new THREE.Vector3();if(!isTouch){if(keys.KeyW)m.add(f);if(keys.KeyS)m.sub(f);if(keys.KeyA)m.sub(r);if(keys.KeyD)m.add(r);if(keys.Space&&onGround){velocityY=JUMP_SPEED;onGround=false}}else{m.add(f.clone().multiplyScalar(joyVec.y));m.add(r.clone().multiplyScalar(joyVec.x))}if(m.lengthSq()){m.normalize().multiplyScalar(MOVE_SPEED*dt);let n=playerPos.clone();n.x+=m.x;if(!collides(n))playerPos.x=n.x;n=playerPos.clone();n.z+=m.z;if(!collides(n))playerPos.z=n.z}playerPos.x=THREE.MathUtils.clamp(playerPos.x,PLAYER_RADIUS,WORLD_SIZE-1-PLAYER_RADIUS);playerPos.z=THREE.MathUtils.clamp(playerPos.z,PLAYER_RADIUS,WORLD_SIZE-1-PLAYER_RADIUS);let old=playerPos.y;velocityY-=GRAVITY*dt;let next=playerPos.clone();next.y+=velocityY*dt;if(velocityY<=0){let floor=standing(playerPos,old);if(next.y<=floor){playerPos.y=floor;velocityY=0;onGround=true}else{playerPos.y=next.y;onGround=false}}else if(!collides(next))playerPos.y=next.y;else velocityY=0;playerGroup.position.copy(playerPos);playerGroup.visible=camMode!==0;const head=playerPos.clone().add(new THREE.Vector3(0,1.7,0)),look=new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch),Math.sin(pitch),Math.cos(yaw)*Math.cos(pitch));if(camMode===0){camera.position.copy(head);camera.lookAt(head.clone().add(look))}else{camera.position.copy(head.clone().sub(look.clone().multiplyScalar(camMode===1?4:-4)));camera.position.y+=1;camera.lookAt(head)}}
const raycaster=new THREE.Raycaster();function hits(){raycaster.set(camera.position,camera.getWorldDirection(new THREE.Vector3()));raycaster.far=5;return raycaster.intersectObjects([...blockMeshes])}function insidePlayer(x,y,z){return Math.abs(x-playerPos.x)<1&&Math.abs(y-(playerPos.y+1))<2&&Math.abs(z-playerPos.z)<1}function place(){const h=hits()[0];if(!h||!h.face)return;const n=h.face.normal,x=Math.round(h.object.position.x+n.x),y=Math.round(h.object.position.y+n.y),z=Math.round(h.object.position.z+n.z);if(insideWorld(x,y,z)&&!world[x][z][y]&&!insidePlayer(x,y,z))createBlock(x,y,z,selectedBlock)}function breakBlock(){const h=hits()[0];if(!h)return;const x=Math.round(h.object.position.x),y=Math.round(h.object.position.y),z=Math.round(h.object.position.z);if(y>0)removeBlock(x,y,z)}
if(!isTouch){addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='F5'){e.preventDefault();camMode=(camMode+1)%3}if(e.code.startsWith('Digit')){let b=BLOCK_TYPES[+e.code.slice(5)-1];if(b){selectedBlock=b.id;renderHotbar()}}});addEventListener('keyup',e=>keys[e.code]=false);addEventListener('mousemove',e=>{if(document.pointerLockElement!==document.body)return;yaw+=e.movementX*mouseSensitivity;pitch+=e.movementY*mouseSensitivity*(invertLook?-1:1);pitch=THREE.MathUtils.clamp(pitch,-1.47,1.47)});document.body.onclick=e=>{if(!e.target.closest('#hotbar,#settings-btn')&&document.pointerLockElement!==document.body)document.body.requestPointerLock()};addEventListener('mousedown',e=>e.button===0?place():e.button===2?breakBlock():0);addEventListener('contextmenu',e=>e.preventDefault())}
function bindTouch(){let look=null;$('look-area').ontouchstart=e=>{let t=e.touches[0];look={x:t.clientX,y:t.clientY}};$('look-area').ontouchmove=e=>{if(!look)return;let t=e.touches[0],dx=t.clientX-look.x,dy=t.clientY-look.y;yaw+=dx*touchSensitivity;pitch+=dy*touchSensitivity*(invertLook?-1:1);pitch=THREE.MathUtils.clamp(pitch,-1.47,1.47);look={x:t.clientX,y:t.clientY}};$('look-area').ontouchend=()=>look=null;let j=$('joystick'),k=$('joystick-knob'),active=false,cx,cy;function reset(){active=false;joyVec.x=joyVec.y=0;k.style.transform='translate(-50%,-50%)'}j.ontouchstart=e=>{e.preventDefault();active=true;let q=j.getBoundingClientRect();cx=q.left+40;cy=q.top+40};j.ontouchmove=e=>{if(!active)return;e.preventDefault();let t=e.touches[0],dx=t.clientX-cx,dy=t.clientY-cy,d=Math.hypot(dx,dy),s=d>30?30/d:1;dx*=s;dy*=s;k.style.transform=`translate(${dx-20}px,${dy-20}px)`;joyVec.x=-dx/30*JOYSTICK_STRENGTH;joyVec.y=-dy/30*JOYSTICK_STRENGTH};j.ontouchend=reset;j.ontouchcancel=reset;$('jump-btn').ontouchstart=e=>{e.preventDefault();if(onGround){velocityY=JUMP_SPEED;onGround=false}};$('cam-btn').ontouchstart=e=>{e.preventDefault();camMode=(camMode+1)%3};let start=null,timer=null,moved=false;$('look-area').addEventListener('touchstart',e=>{start={x:e.touches[0].clientX,y:e.touches[0].clientY};moved=false;timer=setTimeout(()=>{if(!moved)breakBlock()},350)},{passive:true});$('look-area').addEventListener('touchmove',()=>{moved=true},{passive:true});$('look-area').addEventListener('touchend',()=>{clearTimeout(timer);if(start&&!moved)place();start=null},{passive:true})}if(isTouch)bindTouch();
function resetWorld(){if(confirm('Reset your world? This deletes placed blocks.')){localStorage.removeItem('mc_world_'+username);location.reload()}}$('play-btn').onclick=()=>{$('main-menu').hidden=true;gameStarted=true};$('main-menu-settings-btn').onclick=$('settings-btn').onclick=()=>{$('settings-menu').hidden=false};$('close-settings-btn').onclick=()=>{$('settings-menu').hidden=true;if(!gameStarted)$('main-menu').hidden=false};$('reset-world-btn').onclick=$('main-menu-reset-btn').onclick=resetWorld;$('fov-slider').oninput=e=>{camera.fov=+e.target.value;camera.updateProjectionMatrix();$('fov-value').value=e.target.value};$('sensitivity-slider').oninput=e=>{touchSensitivity=+e.target.value;mouseSensitivity=touchSensitivity*.4;$('sensitivity-value').value=touchSensitivity.toFixed(4)};$('invert-look-checkbox').onchange=e=>invertLook=e.target.checked;
let last=performance.now();function animate(now){let dt=(now-last)/1000;last=now;updatePlayer(dt);renderer.render(scene,camera);requestAnimationFrame(animate)}addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});requestAnimationFrame(animate);
</script></body></html>
